description: |
  Arducam MEGA SPI camera module.

  This binding covers the Arducam MEGA 3MP (B0371) and 5MP (B0434)
  camera modules. Both variants use the same SPI command protocol
  and differ only in supported resolutions and sensor characteristics.

  Example device tree node:

    &spi1 {
      arducam_mega: camera@0 {
        compatible = "arducam,mega";
        reg = <0>;
        spi-max-frequency = <8000000>;
        label = "ARDUCAM_MEGA";
      };
    };

compatible: "arducam,mega"

include: [spi-device.yaml]

properties:
  spi-max-frequency:
    required: true
    description: |
      Maximum SPI clock frequency in Hz. The Arducam MEGA supports
      up to 8 000 000 Hz (8 MHz). Do not exceed this value.
