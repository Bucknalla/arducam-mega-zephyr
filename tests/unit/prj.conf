# Unit test project configuration for Arducam MEGA driver
CONFIG_ZTEST=y
CONFIG_ZTEST_NEW_API=y

# Video subsystem
CONFIG_VIDEO=y

# SPI (needed by driver Kconfig dep chain even in test builds)
CONFIG_SPI=y

# Enable the driver under test
CONFIG_VIDEO_ARDUCAM_MEGA=y

# Logging (useful for debugging test failures)
CONFIG_LOG=y
CONFIG_VIDEO_LOG_LEVEL_DBG=y
