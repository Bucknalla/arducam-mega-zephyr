# E2E test project configuration for Arducam MEGA driver
#
# This test suite is intended to run on real hardware with a physical
# Arducam MEGA camera module connected over SPI.  Select a board overlay
# from tests/e2e/boards/ that matches your hardware.

CONFIG_ZTEST=y
CONFIG_ZTEST_NEW_API=y

# Video subsystem
CONFIG_VIDEO=y

# SPI
CONFIG_SPI=y

# Driver under test
CONFIG_VIDEO_ARDUCAM_MEGA=y

# Allow video_buffer_alloc() to use the kernel heap
CONFIG_HEAP_MEM_POOL_SIZE=131072

# Logging
CONFIG_LOG=y
CONFIG_VIDEO_LOG_LEVEL_DBG=y

# Give the tests enough stack space
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
