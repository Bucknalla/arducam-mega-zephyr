# Sample: Arducam MEGA capture to UART
CONFIG_VIDEO=y
CONFIG_VIDEO_ARDUCAM_MEGA=y
CONFIG_SPI=y

# Heap for video_buffer_alloc
CONFIG_HEAP_MEM_POOL_SIZE=131072

# UART for streaming the image data out
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Logging
CONFIG_LOG=y
CONFIG_VIDEO_LOG_LEVEL_INF=y

CONFIG_MAIN_STACK_SIZE=8192
